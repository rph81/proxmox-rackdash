name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    strategy:
      # One version failing must not cancel the others: each result is wanted.
      fail-fast: false
      matrix:
        # The Pi 5 needs Raspberry Pi OS Bookworm (Python 3.11) or newer, so
        # 3.11 is the floor. 3.9 is end-of-life and gone from current runners.
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Self-tests
        run: python3 tools/selftest.py
      - name: Byte-compile every module
        run: python3 -m compileall -q rackdash tools
      - name: Shell scripts parse
        run: bash -n install.sh && bash -n uninstall.sh
